name: Deploy map to GitHub Pages

on:
  # 크롤링 워크플로가 끝나면 최신 데이터로 다시 배포
  workflow_run:
    workflows: ["KAHIS daily crawl"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "scraper/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache
          key: regions-426b795

      - name: Build site
        run: python scraper/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
